name: Agente de Documentacion IA

on:
  push:
    branches:
      - main

jobs:
  documentar:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Otorga permisos para editar y guardar el archivo en el repo
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Ejecutar Agente de IA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python script/summarize.py

      - name: Guardar cambios en el repositorio
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs(ia): actualización automática de bitácora"
          file_pattern: "BITACORA.md"